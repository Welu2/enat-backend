name: Quality, contracts and security
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 ffmpeg
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip check
      - run: ruff format --check app tests scripts
      - run: ruff check app tests scripts
      - run: mypy
      - run: python scripts/generate_postman_collection.py --check
      - run: python scripts/check_contracts.py
      # Collection imports the app with dummy settings and blocked network;
      # test_startup also exercises lifespan startup/shutdown and router exposure.
      - run: python -m pytest
      - run: python scripts/test_database.py --fresh
      - run: python scripts/test_database.py
      - run: ENAT_LOAD_SECONDS=20 python scripts/test_database.py --fresh --load
      - run: python scripts/scan_secrets.py
      - run: python scripts/security_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-and-source-security
          path: artifacts/
          retention-days: 30
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: docker build --pull -t enat:release .
      - run: python scripts/smoke_container.py enat:release
      - run: python scripts/scan_container.py --image enat:release
      - run: docker run --rm --network=none -v "$PWD/deploy:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e test rules /rules/alerts.test.yml
      - run: docker compose -f deploy/compose.yaml config --quiet
        env:
          DEPLOYMENT_ENV: staging
          ENAT_IMAGE: enat:release
          API_ENV_FILE: ../.env.example
          WORKER_ENV_FILE: ../.env.example
          MIGRATION_ENV_FILE: ../.env.example
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 ffmpeg
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python scripts/test_database.py --fresh --load
        env:
          ENAT_LOAD_COMPOSE: '1'
          ENAT_LOAD_IMAGE: enat:release
          ENAT_LOAD_SECONDS: '20'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-security
          path: artifacts/
          retention-days: 30
  capacity:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 ffmpeg
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: docker build --pull -t enat:release .
      - run: python scripts/scan_container.py --image enat:release
      - run: python scripts/test_database.py --fresh --load
        env:
          ENAT_LOAD_COMPOSE: '1'
          ENAT_LOAD_IMAGE: enat:release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capacity-and-recovery
          path: artifacts/
          retention-days: 30

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --disable-socket --allow-unix-socket"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Header", "fastapi.Security", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# Tests register fixtures by import; pytest injects parameters of the same name.
"tests/integration/test_*.py" = ["F811"]
# Environment/network isolation must run before application imports.
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["app/config.py", "app/core/clock.py", "app/core/errors.py", "app/models", "app/services/addis_ai.py", "app/services/provider_runtime.py"]
strict = true
follow_imports = "silent"
warn_unused_configs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

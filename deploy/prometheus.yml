# Merge into the private monitoring installation; never expose bearer tokens or metrics publicly.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: enat-api
    authorization:
      credentials_file: /run/secrets/enat_metrics_token
    static_configs:
      - targets: [api-a:8000, api-b:8000]
  - job_name: enat-worker
    authorization:
      credentials_file: /run/secrets/enat_metrics_token
    static_configs:
      - targets: [worker:9000, scheduler:9000]
